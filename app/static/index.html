<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地赛道计次裁决台</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <h1>🏁 本地赛道计次裁决台</h1>
  <p class="subtitle">录入 1～3 名选手与至多 40 条感应记录，自动按「计次最多 → 总用时最短 → ID 序列字典序最小」裁决</p>
</header>

<main>
  <section class="card" id="runners-card">
    <div class="card-head">
      <h2>① 选手与合格耗时区间（正整数闭区间，秒）</h2>
      <button type="button" id="add-runner" class="btn small">＋ 添加选手</button>
    </div>
    <div class="table-wrap">
      <table class="grid">
        <thead>
          <tr>
            <th>选手编号</th>
            <th>起点 → 中途门 下限</th>
            <th>起点 → 中途门 上限</th>
            <th>中途门 → 终点 下限</th>
            <th>中途门 → 终点 上限</th>
            <th class="col-op"></th>
          </tr>
        </thead>
        <tbody id="runners-body"></tbody>
      </table>
    </div>
  </section>

  <section class="card" id="records-card">
    <div class="card-head">
      <h2>② 感应记录（可乱序；同秒可多条；至多 40 条）</h2>
      <div class="head-actions">
        <button type="button" id="add-record" class="btn small">＋ 添加记录</button>
        <button type="button" id="clear-records" class="btn small ghost">清空记录</button>
        <button type="button" id="load-demo" class="btn small ghost">载入示例</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="grid">
        <thead>
          <tr>
            <th>记录 ID（唯一字符串）</th>
            <th>选手编号</th>
            <th>门</th>
            <th>秒（非负整数）</th>
            <th class="col-op"></th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
    <p class="hint" id="record-count"></p>
  </section>

  <div class="action-bar">
    <button type="button" id="judge-btn" class="btn primary">立即裁决</button>
    <span class="hint">输入有修改会自动重新计算</span>
  </div>

  <section id="errors" class="errors hidden"></section>
  <section id="results"></section>
</main>

<footer class="footer">本地运行 · 数据不离开本机 · FastAPI + 原生 HTML/CSS/JS</footer>

<script src="/static/app.js"></script>
</body>
</html>
